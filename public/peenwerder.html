<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04141c" />
    <meta name="robots" content="noindex" />
    <title>PREYE 👁 Peenwerder</title>
    <!--
      Die Kartenseite heißt seit August 2026 karte.html und liest das Revier aus
      der Adresse. Diese Datei bleibt als Weiterleitung stehen — für alte
      Lesezeichen, für die Verknüpfung auf dem Startbildschirm und für den
      Tiefenlink aus der Standkarte
      (?stand=HR-11&name=…#protokoll), der Parameter UND Anker braucht.

      location.replace, nicht href: sonst schaukelt der Zurück-Knopf zwischen
      Weiterleitung und Ziel.
    -->
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        if (!q.get("revier")) q.set("revier", "peenwerder");
        location.replace("karte.html?" + q.toString() + location.hash);
      })();
    </script>
    <!-- Ohne JavaScript. Verliert die Parameter, aber ohne JavaScript läuft
         auch die Karte nicht — es geht nur darum, irgendwo sinnvoll zu landen. -->
    <noscript><meta http-equiv="refresh" content="0; url=karte.html?revier=peenwerder" /></noscript>
    <style>
      body { font: 15px/1.5 -apple-system, system-ui, sans-serif; padding: 40px; }
    </style>
  </head>
  <body>
    <p>Die Karte liegt jetzt unter
      <a href="karte.html?revier=peenwerder">karte.html?revier=peenwerder</a>.</p>
  </body>
</html>
